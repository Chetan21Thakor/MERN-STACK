<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DOM : Project 1</title>
    <link rel="stylesheet" href="Style.css" />
  </head>
  <body>
    <main>
      <div class="content">
        <div id="box">
          <header>
            <h1>Color Changer</h1>
          </header>
          <div id="input">
            <button id="randomColorBtn">Random Color</button>
            <form>
              <input
                type="text"
                id="userChoiceColor"
                placeholder="Enter Color name or Hex code or RGB"
              />
            </form>
            <button id="applyColorBtn">
                Apply Color
            </button>
          </div>
          <h2 id="h2">Current Color : </h2>
        </div>
      </div>
    </main>
    <script src="App.js"></script>
  </body>
</html>
